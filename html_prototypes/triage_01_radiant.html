<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radiant Typography</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050507; overflow: hidden; font-family: 'Inter', sans-serif;}
    
    .container { padding: 60px 40px; display: flex; flex-direction: column; gap: 40px;}
    
    /* Zero Box items */
    .stream-item {
        display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: transform 0.2s ease;
    }
    .stream-item:hover { transform: translateX(8px); }

    .title { font-weight: 300; font-size: 28px; letter-spacing: -0.02em; transition: all 0.3s ease; }
    .subtitle { font-weight: 300; font-size: 16px; opacity: 0.5; }

    /* Engine Signals mapped directly to Typography */
    .state-unread .title { color: #FFFFFF; font-weight: 400; text-shadow: 0 0 16px rgba(255,255,255,0.2); }
    .state-vote .title { color: #f59e0b; animation: amberPulse 3s infinite alternate; }
    .state-locked .title { color: #10b981; opacity: 0.8; }
    .state-dead .title { color: #F0EFF4; opacity: 0.25; }

    @keyframes amberPulse {
        0% { text-shadow: 0 0 4px rgba(245, 158, 11, 0.1); opacity: 0.8;}
        100% { text-shadow: 0 0 24px rgba(245, 158, 11, 0.4); opacity: 1.0; }
    }

    h1 { color: #ffffff; font-weight: 300; font-size: 14px; letter-spacing: 0.1em; opacity: 0.3; margin-bottom: 24px; text-transform: uppercase;}
</style>
</head>
<body>
    <div class="container">
        <h1>Radiant Triage</h1>

        <!-- VOTE PENDING -->
        <div class="stream-item state-vote">
            <span class="title">Swiss Alps Trip</span>
            <span class="subtitle">Sarah proposed a cabin...</span>
        </div>

        <!-- UNREAD MESSAGE -->
        <div class="stream-item state-unread">
            <span class="title">Product Design Group</span>
            <span class="subtitle">Ram: What are your thoughts on the new void UI?</span>
        </div>

        <!-- LOCKED/RESOLVED -->
        <div class="stream-item state-locked">
            <span class="title">Dinner Tonight</span>
            <span class="subtitle">Locked: 7:30 PM at Noki</span>
        </div>

        <!-- DEAD/READ -->
        <div class="stream-item state-dead">
            <span class="title">Book Club</span>
            <span class="subtitle">Last active 3 weeks ago</span>
        </div>
        
        <div class="stream-item state-dead">
            <span class="title">David Kim</span>
            <span class="subtitle">Sounds good, see you there.</span>
        </div>
    </div>
</body>
</html>
