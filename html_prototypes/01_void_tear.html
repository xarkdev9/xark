<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Void Tear</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap');
    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #050507; overflow: hidden;
        font-family: 'Inter', sans-serif;
    }
    
    #void-canvas {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        display: flex; align-items: center; justify-content: center;
        opacity: 0.2; transform: scale(0.9);
        transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 1;
    }
    #void-canvas.active {
        opacity: 1; transform: scale(1);
    }
    .node {
        width: 100px; height: 100px; background: rgba(255,255,255,0.08); /* Brighter for visibility */
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        color: #D4536B; font-weight: 400; font-size: 18px; position: absolute;
    }

    .ui-layer {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(180deg, #1A1A24 0%, #0A0A0E 100%); /* Lighter for desktop preview */
        border: 2px solid rgba(255,255,255,0.05); /* Adding border strictly for desktop visibility */
        z-index: 10;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
        display: flex; flex-direction: column; padding: 60px 40px; box-sizing: border-box;
    }
    .ui-left { clip-path: polygon(0 0, 50% 0, 48% 100%, 0 100%); }
    .ui-right { clip-path: polygon(50% 0, 100% 0, 100% 100%, 48% 100%); }
    .torn .ui-left { transform: translate(-60vw, 5vh) rotate(-5deg); opacity: 0; pointer-events: none;}
    .torn .ui-right { transform: translate(60vw, -5vh) rotate(5deg); opacity: 0; pointer-events: none;}

    h1 { color: #ffffff; font-weight: 300; font-size: 42px; letter-spacing: -0.03em; margin: 0;}
    p { color: rgba(255, 255, 255, 0.8); font-weight: 300; line-height: 1.6; font-size: 18px; margin-top: 24px; max-width: 600px;}
    .hint { position: absolute; bottom: 40px; left: 0; width: 100%; text-align: center; color: #D4536B; font-size: 16px; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; }
    
    .desktop-btn {
        margin-top: 60px; padding: 16px 32px; background: #D4536B; color: white; border: none; border-radius: 8px;
        font-size: 18px; cursor: pointer; display: inline-block; width: fit-content;
    }
</style>
</head>
<body>

    <div id="void-canvas">
        <div class="node" style="top: 20%; left: 30%;">Sarah</div>
        <div class="node" style="top: 60%; left: 70%;">Ram</div>
        <div class="node" style="top: 40%; left: 50%;">Swiss</div>
        <div style="position: absolute; font-size: 32px; color: #ffffff; font-weight: 300; bottom: 20%;">ask xark anything...</div>
    </div>

    <!-- UI Layer split in two -->
    <div class="ui-layer ui-left">
        <h1>Current Plan</h1>
        <p>This is standard zero-box UI.</p>
        <button class="desktop-btn" onclick="triggerTear()">Click to Simulate Pinch-Tear</button>
        <div class="hint">PINCH OUTWARD (OR CLICK BUTTON)</div>
    </div>
    <div class="ui-layer ui-right">
        <h1>Current Plan</h1>
        <p>This is standard zero-box UI.</p>
        <button class="desktop-btn" onclick="triggerTear()">Click to Simulate Pinch-Tear</button>
        <div class="hint">PINCH OUTWARD (OR CLICK BUTTON)</div>
    </div>

<script>
    let torn = false;

    // Desktop helper to trigger the effect easily
    window.triggerTear = function() {
        if (!torn) {
            torn = true;
            document.body.classList.add('torn');
            document.getElementById('void-canvas').classList.add('active');
        }
    };

    // Mobile implementation fallback
    let initialDistance = null;
    document.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2 && !torn) {
            initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    });

    document.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialDistance && !torn) {
            const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            if (currentDistance > initialDistance + 60) { triggerTear(); }
        }
    });
    document.addEventListener('touchend', (e) => { if (e.touches.length < 2) initialDistance = null; });
</script>
</body>
</html>
