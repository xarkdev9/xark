<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Typographic Ticker</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050507; font-family: 'Inter', sans-serif;}
    
    .container { padding: 40px;}
    
    .ticker-stream {
        display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: baseline; line-height: 2;
    }

    /* Core typography */
    .stream-item {
        color: rgba(240, 239, 244, 0.4); font-weight: 300; font-size: 20px; letter-spacing: -0.01em; cursor: pointer;
    }

    /* Highlight Data mapping */
    .stream-unread { color: #FFFFFF; font-weight: 400; }
    .stream-vote { color: #f59e0b; }
    .stream-locked { color: #10b981; opacity: 0.5; text-decoration: line-through;}

    span.name { margin-right: 6px; }
    span.data { color: rgba(255,255,255,0.3); font-size: 16px; }
    .stream-unread span.data { color: rgba(255,255,255,0.8); }

    h1 { color: #ffffff; font-weight: 300; font-size: 14px; letter-spacing: 0.1em; opacity: 0.3; margin-bottom: 24px; text-transform: uppercase;}
</style>
</head>
<body>
    <div class="container">
        <h1>The Data Stream</h1>
        
        <div class="ticker-stream">
            <div class="stream-item stream-vote"><span class="name">Swiss Alps</span><span class="data">Vote on flights</span></div>
            <div class="stream-item"><span class="name">David Kim</span><span class="data">See you then.</span></div>
            <div class="stream-item stream-unread"><span class="name">Product UI</span><span class="data">Ram: Looks great!</span></div>
            <div class="stream-item"><span class="name">Book Club</span><span class="data">Quiet</span></div>
            <div class="stream-item stream-locked"><span class="name">Dinner</span><span class="data">7:30 PM</span></div>
            <div class="stream-item stream-unread"><span class="name">Sarah J.</span><span class="data">Call me</span></div>
            <div class="stream-item"><span class="name">House Hunt</span><span class="data">No updates.</span></div>
        </div>
        
    </div>
</body>
</html>
