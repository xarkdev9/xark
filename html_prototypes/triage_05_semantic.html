<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Semantic Glyphs</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap');
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050507; overflow: hidden; font-family: 'Inter', sans-serif;}
    
    .container { padding: 40px 40px; display: flex; flex-direction: column; gap: 32px;}

    .stream-item {
        color: #F0EFF4; font-weight: 300; font-size: 32px; letter-spacing: -0.02em;
        display: flex; align-items: center; gap: 16px; cursor: pointer; transition: opacity 0.3s ease;
    }
    
    /* Semantic Badges via standard unicode geometry */
    .glyph { font-size: 14px; margin-top: 4px; }
    
    .unread .glyph { color: #FFFFFF; text-shadow: 0 0 10px rgba(255,255,255,0.5);}
    .vote .glyph { color: #f59e0b; }
    .locked .glyph { color: #10b981; }
    
    .quiet { opacity: 0.3; }
    .quiet .glyph { opacity: 0; }

    h1 { color: #ffffff; font-weight: 300; font-size: 14px; letter-spacing: 0.1em; opacity: 0.3; margin-bottom: 24px; text-transform: uppercase;}
</style>
</head>
<body>
    <div class="container">
        <h1>Semantic Geometry</h1>

        <div class="stream-item vote">
            <span class="glyph">▲</span>
            <span class="title">Swiss Alps Trip</span>
        </div>

        <div class="stream-item unread">
            <span class="glyph">●</span>
            <span class="title">Product Design Group</span>
        </div>
        
        <div class="stream-item unread">
            <span class="glyph">●</span>
            <span class="title">Sarah Jenkins</span>
        </div>

        <div class="stream-item locked">
            <span class="glyph">◆</span>
            <span class="title">Dinner Tonight</span>
        </div>

        <div class="stream-item quiet">
            <span class="glyph">○</span>
            <span class="title">Book Club</span>
        </div>
    </div>
</body>
</html>
