name: chat_engine
description: Production-grade E2EE Flutter chat engine. Headless — no UI code.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  cryptography: ^2.7.0
  drift: ^2.18.0
  drift_sqflite: ^2.0.1
  firebase_messaging: ^15.0.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  freezed_annotation: ^2.4.0
  http: ^1.2.0
  json_annotation: ^4.9.0
  path_provider: ^2.1.0
  rxdart: ^0.27.7
  sqlite3_flutter_libs: ^0.5.0
  supabase_flutter: ^2.8.0
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.0
  very_good_analysis: ^6.0.0
